name: test
on:
  push: { branches: [main] }
  pull_request:
jobs:
  self-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # Uses the real adapter from stellar-tripwire, not a stub, so this proves the
      # action against the same code other projects would actually run.
      - name: fetch the reference JS adapter
        shell: bash
        run: |
          git clone --quiet --depth 1 https://github.com/Protocol-Nok/stellar-tripwire "$RUNNER_TEMP/tool"
          cp -r "$RUNNER_TEMP/tool/adapters/js" ./ref-adapter
          cd ref-adapter && npm install --no-audit --no-fund --silent

      # A relative, forward-slash path on purpose: on Windows, github.workspace is
      # backslash-separated, and the action's run step inserts `adapter` unquoted
      # into a bash command line (deliberately, so "node" and the script path stay
      # separate argv entries) -- bash then strips those backslashes as escapes,
      # corrupting the path. See the README's "Path separators" note.
      - name: run stellar-tripwire against the current @stellar/stellar-sdk
        id: tripwire
        uses: ./
        with:
          adapter: "node ref-adapter/adapter.mjs"

      - name: the current SDK release must have zero failures
        shell: bash
        run: |
          echo "pass=${{ steps.tripwire.outputs.pass }} fail=${{ steps.tripwire.outputs.fail }} unsupported=${{ steps.tripwire.outputs.unsupported }}"
          test "${{ steps.tripwire.outputs.fail }}" = "0"

  self-test-detects-a-known-bug:
    # Proof the action can fail: point it at a pre-fix SDK release and require exactly
    # the three known failures, same evidence as stellar-tripwire's own CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - shell: bash
        run: |
          git clone --quiet --depth 1 https://github.com/Protocol-Nok/stellar-tripwire "$RUNNER_TEMP/tool"
          cp -r "$RUNNER_TEMP/tool/adapters/js" ./ref-adapter
          mkdir old-sdk && cd old-sdk && npm init -y >/dev/null && npm i --silent @stellar/stellar-sdk@17.2.0
      - id: tripwire
        uses: ./
        continue-on-error: true
        with:
          adapter: "node ref-adapter/adapter.mjs"
        env:
          TRIPWIRE_SDK_DIR: ${{ github.workspace }}/old-sdk
      - shell: bash
        run: |
          test "${{ steps.tripwire.outputs.fail }}" = "3" || { echo "expected 3 known failures, got ${{ steps.tripwire.outputs.fail }}"; exit 1; }
